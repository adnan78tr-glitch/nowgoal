<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Nowgoal — Fikstür & Oranlar</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            padding: 0; 
            margin: 0; 
            font-size: 12px; 
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff; 
            min-height: 100vh; 
        }
        .container { 
            max-width: 100%; 
            margin: 0; 
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(0,212,255,0.2); 
            padding: 15px; 
            border-radius: 20px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.3); 
            color: #fff; 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            backdrop-filter: blur(10px);
            overflow: hidden;
        }
        .header { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            margin-bottom: 15px; 
            flex-wrap: wrap; 
            gap: 10px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(0,212,255,0.2);
            flex-shrink: 0;
        }
        .header h2 { 
            margin: 0; 
            font-size: 18px; 
            color: #00d4ff;
            font-weight: 700;
        }
        .hbtn { 
            padding: 8px 16px; 
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .hbtn:hover {
            transform: translateY(-2px);
        }
        .hbtn:disabled { 
            background: rgba(255,255,255,0.1); 
            cursor: not-allowed;
        }
        #searchBox {
            flex: 1; 
            padding: 8px 14px;
            border: 2px solid rgba(0,212,255,0.3);
            border-radius: 10px; 
            font-size: 12px;
            background: rgba(255,255,255,0.1); 
            color: #fff;
            min-width: 200px;
        }
        #tableWrapper {
            overflow-x: auto;
            overflow-y: auto;
            flex: 1;
        }
        .fix-tbl { 
            width: 100%; 
            border-collapse: collapse;
            font-size: 11px;
        }
        .fix-tbl th {
            background: linear-gradient(135deg, #00d4ff 0%, #7b2cbf 100%);
            color: #fff; 
            text-align: center;
            position: sticky; 
            top: 0; 
            z-index: 1001; 
            white-space: nowrap;
            padding: 6px 4px;
            font-weight: 600;
        }
        .league-row td {
            background: linear-gradient(135deg, rgba(0,212,255,0.2) 0%, rgba(123,44,191,0.3) 100%);
            font-weight: bold; 
            color: #00d4ff;
            padding: 8px 12px; 
            cursor: pointer;
        }
        .match-row td { 
            padding: 6px 4px; 
            border-bottom: 1px solid rgba(0,212,255,0.1);
            background: rgba(255,255,255,0.03);
            color: #fff;
        }
        .match-row:nth-child(even) td {
            background: rgba(255,255,255,0.05);
        }
        .match-row:hover td { 
            background: rgba(0,212,255,0.15) !important;
        }
        .match-row.hidden { display: none; }
        .badge { 
            display: inline-block; 
            padding: 3px 8px; 
            border-radius: 20px; 
            font-size: 10px; 
            font-weight: 700;
        }
        .b-done  { 
            background: #808080;
            color: #fff;
        }
        .b-live  { 
            background: #ff5252;
            color: #fff;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        .b-sched { 
            background: #1976d2;
            color: #fff;
        }
        .c { text-align: center; }
        .odds-cell { 
            font-size: 10px; 
            text-align: center;
            font-weight: 600;
            color: #fff;
        }
        #loadingBar { 
            height: 4px; 
            background: rgba(0,212,255,0.2); 
            overflow: hidden; 
            display: none;
            margin-bottom: 10px;
        }
        #loadingFill { 
            height: 100%; 
            width: 0; 
            background: linear-gradient(90deg, #456da8, #00d4ff);
            transition: width .3s;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h2>Nowgoal - Fikstür & Oranlar</h2>
            <span id="dateLabel" style="font-size: 12px; color: #00d4ff;"></span>
        </div>
        <div>
            <span id="matchCount" style="font-size: 12px; color: #00d4ff; margin-right: 10px;"></span>
            <button class="hbtn" id="btnRefresh" onclick="loadFixture()">Yenile</button>
        </div>
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap;">
        <input id="searchBox" type="text" placeholder="Lig veya takım ara..." oninput="onSearch()">
        <button class="hbtn" onclick="toggleAll(true)">Tümünü Aç</button>
        <button class="hbtn" onclick="toggleAll(false)">Tümünü Kapat</button>
    </div>

    <div id="loadingBar"><div id="loadingFill"></div></div>

    <div id="tableWrapper">
        <table class="fix-tbl">
            <thead>
                <tr>
                    <th style="width:50px">ID</th>
                    <th style="width:70px">Tarih</th>
                    <th style="width:50px">Saat</th>
                    <th style="width:120px">Lig</th>
                    <th style="width:120px">Ev Sahibi</th>
                    <th style="width:120px">Deplasman</th>
                    <th style="width:45px">HT</th>
                    <th style="width:45px">FT</th>
                    <th style="width:60px">Durum</th>
                    <th colspan="3">HT 1X2</th>
                    <th colspan="3">HT Handikap</th>
                    <th colspan="3">HT Gol Baremi</th>
                    <th colspan="3">FT 1X2</th>
                    <th colspan="3">FT Handikap</th>
                    <th colspan="3">FT Gol Baremi</th>
                </tr>
                <tr>
                    <th colspan="9"></th>
                    <th>1</th><th>X</th><th>2</th>
                    <th>Ev</th><th>H</th><th>Dep</th>
                    <th>Alt</th><th>B</th><th>Üst</th>
                    <th>1</th><th>X</th><th>2</th>
                    <th>Ev</th><th>H</th><th>Dep</th>
                    <th>Alt</th><th>B</th><th>Üst</th>
                </tr>
            </thead>
            <tbody id="fixBody"></tbody>
        </table>
    </div>
</div>

<script>
const BASE = 'https://live7.nowgoal26.com';
const PROXY = 'https://api.codetabs.com/v1/proxy?quest=';

let allRows = [], leagueMap = {}, oddsData = {};

async function fetchWithProxy(url) {
    try {
        const response = await Promise.race([
            fetch(PROXY + encodeURIComponent(url)),
            new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 10000))
        ]);
        if (response.ok) {
            return await response.text();
        }
    } catch (e) {
        console.error(`❌ Fetch hatası: ${e.message}`);
    }
    return null;
}

async function fetchJsonFromAPI(url) {
    const data = await fetchWithProxy(url);
    if (!data) return null;
    try {
        return JSON.parse(data);
    } catch {
        const match = data.match(/\{[\s\S]*\}/);
        if (match) return JSON.parse(match[0]);
    }
    return null;
}

async function fetchLiveOdds() {
    console.log('🔄 Canlı oranlar yükleniyor...');
    const oddsMap = {};
    const ts = Date.now();
    const liveUrl = `${BASE}/gf/data/odds/en/runOddsData_8.txt?${ts}`;
    const liveData = await fetchWithProxy(liveUrl);
    
    if (liveData && liveData.length > 100) {
        const entries = liveData.split('$');
        console.log(`✓ ${entries.length} oran entry bulundu`);
        
        for (const entry of entries) {
            if (!entry.includes('!')) continue;
            const [id, ...rest] = entry.split('!');
            const sections = rest.join('!').split('!');
            const parseSection = (s) => s ? s.split(',') : [];
            
            oddsMap[id] = {
                ft_euro: { kp: parseSection(sections[1]).slice(3, 6) },
                ft_ah: { kp: parseSection(sections[0]).slice(3, 6) },
                ft_ou: { kp: parseSection(sections[2]).slice(3, 6) },
                ht_euro: { kp: parseSection(sections[4]).slice(3, 6) },
                ht_ah: { kp: parseSection(sections[3]).slice(3, 6) },
                ht_ou: { kp: parseSection(sections[5]).slice(3, 6) }
            };
        }
    }
    console.log(`✓ ${Object.keys(oddsMap).length} maç için oran yüklendi`);
    return oddsMap;
}

function formatOdds(val) {
    if (!val || val === '0') return '-';
    const num = parseFloat(val);
    return isNaN(num) || num === 0 ? '-' : num.toFixed(2);
}

function renderOdds(odds, type) {
    if (!odds || !odds[type]) {
        return `<td class="odds-cell">-</td><td class="odds-cell">-</td><td class="odds-cell">-</td>`;
    }
    const kp = odds[type].kp || [];
    return `
        <td class="odds-cell">${formatOdds(kp[0])}</td>
        <td class="odds-cell">${formatOdds(kp[1])}</td>
        <td class="odds-cell">${formatOdds(kp[2])}</td>
    `;
}

async function fetchFixture() {
    const nowMs = Date.now();
    const fromMs = nowMs - 72 * 3600000;
    const toMs = nowMs + 48 * 3600000;
    const CST = 8 * 3600000;

    const dates = [];
    const cur = new Date((fromMs + CST));
    const end = new Date((toMs + CST));
    cur.setUTCHours(0, 0, 0, 0);
    end.setUTCHours(0, 0, 0, 0);
    
    while (cur <= end) {
        dates.push(cur.toISOString().split('T')[0]);
        cur.setUTCDate(cur.getUTCDate() + 1);
    }

    console.log(`📅 ${dates.length} gün kontrol ediliyor:`, dates);
    
    const results = [], seenIds = new Set();
    
    for (const date of dates) {
        console.log(`🔍 ${date} için fikstür çekiliyor...`);
        const json = await fetchJsonFromAPI(`${BASE}/Ajax/SoccerAjax/?type=6&date=${date}`);
        if (!json?.Data) {
            console.log(`⚠️ ${date} için veri yok`);
            continue;
        }
        
        const data = json.Data;
        console.log(`✓ ${date} veri geldi (${data.length} byte)`);
        
        // Ligleri parse et: B[1]=[...,'Liga Adı',...] 
        const leagues = {};
        const bRe = /B\[(\d+)\]=\[[^\]]*?'[^']*?','([^']*)'/g;
        let bm;
        while ((bm = bRe.exec(data)) !== null) {
            leagues[bm[1]] = bm[2];
        }
        console.log(`  Ligler: ${Object.keys(leagues).length} adet`);
        
        // Maçları parse et
        // Format: A[1]=[matchId, ligIdx, homeTeamId, awayTeamId, 'Home', 'Away', 'yyyy,m,d,h,mm,ss', state, ...]
        const aRe = /A\[(\d+)\]=\[(\d+),\s*(\d+),\s*(\d+),\s*(\d+),\s*'([^']*)'\s*,\s*'([^']*)'\s*,\s*'(\d{4}),(\d+),(\d+),(\d+),(\d+),(\d+)'\s*,\s*(-?\d+)/g;
        let am;
        let matchCount = 0;
        while ((am = aRe.exec(data)) !== null) {
            const [, , id, ligIdx, homeId, awayId, home, away, yr, mo, dy, hr, mn, sec, state] = am;
            
            if (seenIds.has(+id)) continue;
            seenIds.add(+id);
            matchCount++;
            
            const matchMs = Date.UTC(+yr, +mo - 1, +dy, +hr, +mn, +sec);
            if (matchMs < fromMs || matchMs > toMs) continue;
            
            const d = new Date(matchMs);
            results.push({
                id: +id,
                date: d.toLocaleDateString('tr-TR'),
                time: d.toTimeString().slice(0, 5),
                league: leagues[ligIdx] || `Lig#${ligIdx}`,
                home: home.trim(),
                away: away.trim(),
                ht: state === '-1' || +state > 0 ? '-' : '-',
                ft: state === '-1' || +state > 0 ? '-' : '-',
                state: +state
            });
        }
        console.log(`  ${matchCount} maç parse edildi`);
    }
    
    console.log(`✅ Toplam ${results.length} maç bulundu`);
    results.sort((a, b) => a.id - b.id);
    return results;
}

async function buildTable(matches) {
    const tbody = document.getElementById('fixBody');
    tbody.innerHTML = '';
    allRows = [];
    leagueMap = {};
    
    console.log('📊 Tablo oluşturuluyor...');
    oddsData = await fetchLiveOdds();
    
    const filtered = matches.filter(m => !/\bwomen\b/i.test(m.league));
    console.log(`📈 Gösterilecek: ${filtered.length} maç (kadın ligleri hariç)`);
    
    let lastLeague = null;
    let leagueMatchCount = 0;
    
    for (const m of filtered) {
        if (m.league !== lastLeague) {
            if (lastLeague) {
                console.log(`  ${lastLeague}: ${leagueMatchCount} maç`);
            }
            lastLeague = m.league;
            leagueMatchCount = 0;
            
            const tr = document.createElement('tr');
            tr.className = 'league-row';
            tr.innerHTML = `<td colspan="27"><span style="margin-right:8px">▼</span>${m.league}</td>`;
            tr.onclick = () => toggleLeague(m.league);
            tbody.appendChild(tr);
            leagueMap[m.league] = { el: tr, matches: [], open: true };
            allRows.push({ el: tr, league: m.league.toLowerCase(), type: 'l' });
        }
        leagueMatchCount++;
        
        const tr = document.createElement('tr');
        tr.className = 'match-row';
        tr.dataset.search = `${m.league} ${m.home} ${m.away}`.toLowerCase();
        tr.dataset.league = m.league.toLowerCase();
        
        const odds = oddsData[m.id];
        const status = m.state === -1 ? '<span class="badge b-done">Bitti</span>' :
                      m.state === 0 ? '<span class="badge b-sched">Planlandı</span>' :
                      m.state === 100 ? '<span class="badge b-sched">Devre</span>' :
                      '<span class="badge b-live">Canlı</span>';
        
        tr.innerHTML = `
            <td class="c">${m.id}</td>
            <td class="c">${m.date}</td>
            <td class="c">${m.time}</td>
            <td>${m.league}</td>
            <td><b>${m.home}</b></td>
            <td>${m.away}</td>
            <td class="c">${m.ht}</td>
            <td class="c">${m.ft}</td>
            <td class="c">${status}</td>
            ${renderOdds(odds, 'ht_euro')}
            ${renderOdds(odds, 'ht_ah')}
            ${renderOdds(odds, 'ht_ou')}
            ${renderOdds(odds, 'ft_euro')}
            ${renderOdds(odds, 'ft_ah')}
            ${renderOdds(odds, 'ft_ou')}
        `;
        
        tbody.appendChild(tr);
        leagueMap[m.league].matches.push(tr);
        allRows.push({ el: tr, search: tr.dataset.search, type: 'm' });
    }
    
    if (lastLeague) {
        console.log(`  ${lastLeague}: ${leagueMatchCount} maç`);
    }
    console.log(`✅ Tablo hazır! ${allRows.length} satır`);
}

function toggleLeague(name) {
    const g = leagueMap[name];
    if (g) {
        g.open = !g.open;
        g.matches.forEach(m => m.hidden = !g.open);
    }
}

function toggleAll(open) {
    Object.values(leagueMap).forEach(g => {
        g.open = open;
        g.matches.forEach(m => m.hidden = !open);
    });
}

function onSearch() {
    const q = document.getElementById('searchBox').value.toLowerCase();
    allRows.forEach(r => {
        if (r.type === 'm') {
            r.el.hidden = !r.search.includes(q);
        }
    });
}

async function loadFixture() {
    console.clear();
    console.log('🚀 Fikstür yükleme başlıyor...\n');
    
    const now = Date.now();
    const fmt = ms => new Date(ms + 3 * 3600000).toISOString().slice(0, 16).replace('T', ' ');
    
    document.getElementById('dateLabel').textContent = `${fmt(now - 72*3600000)} → ${fmt(now + 48*3600000)}`;
    document.getElementById('btnRefresh').disabled = true;
    document.getElementById('matchCount').textContent = 'Yükleniyor...';
    
    const bar = document.getElementById('loadingBar');
    bar.style.display = 'block';
    document.getElementById('loadingFill').style.width = '30%';
    
    const matches = await fetchFixture();
    document.getElementById('loadingFill').style.width = '70%';
    
    await buildTable(matches);
    document.getElementById('loadingFill').style.width = '100%';
    
    setTimeout(() => {
        bar.style.display = 'none';
        document.getElementById('loadingFill').style.width = '0';
    }, 300);
    
    document.getElementById('matchCount').textContent = `${matches.length} maç`;
    document.getElementById('btnRefresh').disabled = false;
    console.log('\n✅ Tüm işlem tamamlandı!');
}

document.addEventListener('DOMContentLoaded', loadFixture);
</script>
</body>
</html>
